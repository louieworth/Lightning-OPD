# 1102 cluster (2 pods x 8 H100, pre-started Ray, no shared filesystem); generated by
# tools/make_byte16_presets.py from qwen3_1_7b_nt_teacher_4b_instruct_2507_k1.yaml. K=1 (Lightning OPD / Semi-OPD). Changed: paths, models,
# 16-GPU layout, eval = AIME24/25/26 + HMMT Feb26, avg@8, 32k, step-0 eval once per student
# (user-approved items 7-10); generation throughput 64 requests/engine, 1024 client threads
# (user-approved 11/02); K=40/K=120: the OPD GPU split doubled (actor 4, rollout 8, teacher TP4).
# All training settings are the source preset's.
# Qwen3-1.7B Lightning OPD (instruct, non-thinking). Launcher keys follow the opd-baselines naming;
# training keys map directly to slime flags (underscore -> hyphen).
method: lightning_opd
# Student initialization: HuggingFace model ID or local HF model directory.
model_path: /opt/tiger/models/Qwen3-1.7B-Base
teacher_model_path: /opt/tiger/models/Qwen3-4B-Instruct-2507
model_type: qwen3-1.7B
local_models_only: true
hf_home: /opt/tiger/Lightning-OPD/.runtime/hf
auto_prepare_model: true  # Convert to Megatron when the student checkpoint is missing.
conversion_num_gpus: 4

# Use the active Python environment or the upstream Docker image.
python_executable: null  # Current Python; optionally set an interpreter path.
# Full Megatron must be installed; optionally set a source path or MEGATRON_PATH.
megatron_path: null
# CUDA compiler for JIT comes from CUDA_HOME/PATH unless overridden here.
cuda_home: null
# W&B settings and credentials; relative env_file paths resolve from the repo root.
env_file: .env
use_wandb: true
experiment_name: qwen3_1_7b_base_nt_teacher_4b_instruct_2507_k1_byte16
output_dir: /opt/tiger/Lightning-OPD/outputs
resume: auto  # Resume a present training checkpoint; otherwise start from the base model.

# Cluster allocation: 2 nodes x 4 H100s (8 total); sbatch wall time is 6 hours.
nnodes: 2
n_gpus_per_node: 8
startup_timeout: 3600
actor_num_nodes: 2
actor_num_gpus_per_node: 8
# Student inference engines share actor GPUs for block rollouts and evaluation.
# Actor/inference memory is offloaded before each block's temporary teacher scoring.
colocate: true
rollout_num_gpus: 16
rollout_num_gpus_per_engine: 1
sglang_mem_fraction_static: 0.4
# Bound 16k-token evaluation requests; the upstream default is 512 per engine.
sglang_server_concurrency: 64
sglang_max_running_requests: 64
router_policy: round_robin  # Spread long evaluation requests across all engines.
# Training intentionally offloads workers. Keep health checks, but avoid opening
# every circuit during memory/weight transitions and recover healthy workers quickly.
router_disable_circuit_breaker: true
router_health_check_timeout_secs: 30
router_health_check_interval_secs: 10
router_health_success_threshold: 1

# The default sbatch builds the fixed prompt sequence, then alternates K times:
# current-policy student rollout -> cached teacher logprobs -> block training.
# Prepared parquet inputs live outside the checkout under /scratch/l/luli/data/lightning_opd/.
# Optional format conversion: python configs/lightning_opd/qwen3-4b-lightning-opd.py --config configs/config/qwen3_1_7b_nt_teacher_4b_instruct_2507_k1.yaml --convert-datasets
source_data_dir: /opt/tiger/Lightning-OPD/data/source
train_files: /opt/tiger/Lightning-OPD/data/lightning_opd/train/dapo_math_17k_en.parquet
max_train_samples: 100000
# null -> <output_dir>/<experiment_name>/data/fixed_prompts.parquet
# Exactly num_rollout * rollout_batch_size rows, repeating DAPO in source-file order.
# This prompt order is independent of K; responses/logprobs are cached per block.
lightning_fixed_data: null
input_key: prompt
label_key: label
metadata_key: metadata
# Offline prompts are already rendered; never apply a second chat template.
apply_chat_template: false
apply_chat_template_kwargs: {enable_thinking: false}
rollout_shuffle: false  # Fixed absolute positions; the builder keeps DAPO source-file order.
rollout_seed: 42
seed: 42
num_rollout: 120  # 1 epoch: 14484 prompts / 128 batch = 113 → 120 (divisible by eval_steps=20).
policy_rollout_k: 1  # Integer in [1, num_rollout]; number of current-policy rollout blocks.
rollout_batch_size: 128
n_samples_per_prompt: 1
rollout_max_prompt_len: 2048
rollout_max_response_len: 16384
rollout_temperature: 1.0
rollout_top_p: 1.0
rollout_top_k: -1
# Stop on ChatML end-of-turn or native end-of-text; also used during evaluation.
rollout_stop_token_ids: [151645, 151643]
global_batch_size: 128
balance_data: false

# One-node CPU preparation builds the fixed 15,360-row sequence before training.
# Each block uses current Ray student engines; teacher scoring temporarily uses 2 GPUs.
precompute_concurrency: 1024
precompute_port: 13142
precompute_tp_size: 2  # Legacy preparer only; block rollouts use rollout_num_gpus_per_engine.
teacher_num_gpus: 2  # Teacher scoring is temporary; all 8 GPUs remain available for training.
teacher_tp_size: 2
teacher_port: 13141
teacher_mem_fraction_static: 0.6
teacher_context_length: 32768
teacher_chunked_prefill_size: 4096
teacher_url: null

custom_rm_path: slime.rollout.on_policy_distillation.reward_func
custom_reward_post_process_path: slime.rollout.on_policy_distillation.post_process_rewards
include_verifiable_reward: false
advantage_estimator: on_policy_distillation
use_kl_loss: true
kl_loss_coef: 0.0
kl_loss_type: low_var_kl
entropy_coef: 0.0
# Vocabulary support for reverse-KL distillation; independent of policy_rollout_k.
opd_loss_token_mode: sample  # sample | top_k_student | top_k_teacher | full_vocab
opd_token_top_k: 32  # Vocabulary candidates, NOT the number of policy rollout blocks. In sample mode this only affects metrics (T-S/T-D/S-D overlap), not the loss.
opd_distribution_chunk_size: 32  # Bound dense-logit reconstruction/gather memory.
opd_loss_max_clip: 10.0  # sample: advantage +/-10; distribution modes: per-position KL <=10.
opd_log_prob_min_clip: -10.0  # sample only; null disables this logprob floor.
# Distribution loss caches teacher hidden states and a frozen output head on shared disk.
optimizer: adam
lr: 1.0e-6
lr_decay_style: constant
lr_warmup_iters: 25
clip_grad: 1.0
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.999

tensor_model_parallel_size: 2
sequence_parallel: true
pipeline_model_parallel_size: 1
context_parallel_size: 1
expert_model_parallel_size: 1
expert_tensor_parallel_size: 1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
use_dynamic_batch_size: true
max_tokens_per_gpu: 16384
attention_dropout: 0.0
hidden_dropout: 0.0
accumulate_allreduce_grads_in_fp32: true
attention_softmax_in_fp32: true
# TE 2.6 supports packed GQA through cuDNN; its FA2 limit is 2.8.1,
# whereas the shared verl environment has FA2 2.8.3.
attention_backend: fused

# Answer accuracy on the same local validation sets using slime.eval scorers.
# these are the cluster's comparison sets, not the paper's full benchmark suite.
# Evaluation runs before training and every 20 steps, including the final step 120.
# Keep num_rollout divisible by eval_steps to evaluate the final trained weights.
eval_steps: 20
eval_on_resume: true  # Recover an evaluation interrupted after checkpoint saving.
val_before_train: true
val_files:
  - /opt/tiger/Lightning-OPD/data/lightning_opd/eval/aime24.parquet
  - /opt/tiger/Lightning-OPD/data/lightning_opd/eval/aime25.parquet
  - /opt/tiger/Lightning-OPD/data/lightning_opd/eval/aime26.parquet
  - /opt/tiger/Lightning-OPD/data/lightning_opd/eval/hmmt26.parquet
val_max_prompt_length: 4096
val_max_completion_length: 32768
val_n: 8
val_temperature: 1.0
val_top_p: 1.0
val_top_k: -1
save_eval_generations: false
save_model: active  # Save full training state before each evaluation.
save_eval_multiplier: 1
# Resume inside a block reuses its saved policy ID and cached teacher logprobs.
save_total_limit: 1  # null keeps all training checkpoints.
save_retain_interval: null  # Disable Megatron's separate interval-based pruning.
async_save: false
# Keys added for the 1102 cluster.
ray_cluster: existing
sglang_context_length: 40960
